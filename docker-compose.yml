services:
  checki-landing:
    restart: unless-stopped
    image: nginx:alpine
    volumes:
      - ./landing:/usr/share/nginx/html:ro
    networks:
      - n8n_default
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=n8n_default"
      - "traefik.http.services.checki_landing_svc.loadbalancer.server.port=80"
      - "traefik.http.routers.checki_landing.rule=Host(`checki.ge`)"
      - "traefik.http.routers.checki_landing.entrypoints=websecure"
      - "traefik.http.routers.checki_landing.tls=true"
      - "traefik.http.routers.checki_landing.tls.certresolver=mytlschallenge"
      - "traefik.http.routers.checki_landing.service=checki_landing_svc"
  checki-admin:
    restart: unless-stopped
    image: nginx:alpine
    volumes:
      - ./admin:/usr/share/nginx/html:ro
    networks:
      - n8n_default
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=n8n_default"
      - "traefik.http.services.checki_admin_svc.loadbalancer.server.port=80"
      - "traefik.http.routers.checki_admin.rule=Host(`admin.checki.ge`)"
      - "traefik.http.routers.checki_admin.entrypoints=websecure"
      - "traefik.http.routers.checki_admin.tls=true"
      - "traefik.http.routers.checki_admin.tls.certresolver=mytlschallenge"
      - "traefik.http.routers.checki_admin.service=checki_admin_svc"

  checki-super:
    restart: unless-stopped
    image: nginx:alpine
    volumes:
      - ./super:/usr/share/nginx/html:ro
    networks:
      - n8n_default
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=n8n_default"
      - "traefik.http.services.checki_super_svc.loadbalancer.server.port=80"
      - "traefik.http.routers.checki_super.rule=Host(`super.checki.ge`)"
      - "traefik.http.routers.checki_super.entrypoints=websecure"
      - "traefik.http.routers.checki_super.tls=true"
      - "traefik.http.routers.checki_super.tls.certresolver=mytlschallenge"
      - "traefik.http.routers.checki_super.service=checki_super_svc"

  checki-db:
    restart: unless-stopped
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: checki
      POSTGRES_USER: checki
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - checki_db:/var/lib/postgresql/data
    networks:
      - n8n_default
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U checki -d checki"]
      interval: 5s
      timeout: 3s
      retries: 20

  checki-api:
    restart: unless-stopped
    build:
      context: ./backend
    env_file: .env
    environment:
      DB_HOST: checki-db
      DB_PORT: "5432"
      DB_NAME: checki
      DB_USER: checki
    depends_on:
      checki-db:
        condition: service_healthy
    networks:
      - n8n_default
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=n8n_default"
      - "traefik.http.services.checki_api_svc.loadbalancer.server.port=8000"

      - "traefik.http.routers.checki_api.rule=Host(`api.checki.ge`)"
      - "traefik.http.routers.checki_api.entrypoints=websecure"
      - "traefik.http.routers.checki_api.tls=true"
      - "traefik.http.routers.checki_api.tls.certresolver=mytlschallenge"
      - "traefik.http.routers.checki_api.service=checki_api_svc"

  checki-bot:
    restart: unless-stopped
    build:
      context: .
      dockerfile: Dockerfile.bot
    env_file: .env
    environment:
      DB_HOST: checki-db
      DB_PORT: "5432"
      DB_NAME: checki
      DB_USER: checki
    depends_on:
      checki-db:
        condition: service_healthy
    networks:
      - n8n_default

volumes:
  checki_db:

networks:
  n8n_default:
    external: true
