repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: ruff check --fix
        language: system
        types: [python]
        pass_filenames: false
        args: [backend/app/]

      - id: ruff-format
        name: ruff format
        entry: ruff format
        language: system
        types: [python]
        pass_filenames: false
        args: [backend/app/]

      - id: mypy
        name: mypy strict
        entry: mypy --strict
        language: system
        types: [python]
        pass_filenames: false
        args: [backend/app/]

      - id: unit-tests
        name: unit tests (no DB)
        entry: pytest tests/test_parsers.py -x
        language: system
        pass_filenames: false
