<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Checki.ge — Redesign</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --accent-h: 148;
    --accent-s: 0.17;
    --accent-l: 0.76;
    --accent: oklch(var(--accent-l) var(--accent-s) var(--accent-h));
    --accent-soft: oklch(var(--accent-l) var(--accent-s) var(--accent-h) / 0.16);
    --accent-strong: oklch(0.82 0.18 var(--accent-h));
    --warn: oklch(0.78 0.14 75);
    --warn-soft: oklch(0.78 0.14 75 / 0.14);
    --danger: oklch(0.62 0.2 25);
  }
  html, body { margin: 0; padding: 0; font-family: 'Inter', -apple-system, system-ui, sans-serif; -webkit-font-smoothing: antialiased; font-feature-settings: 'ss01', 'cv11', 'cv03'; }
  body { min-height: 100vh; overflow-x: hidden; }
  * { box-sizing: border-box; }
  input, button, textarea { font-family: inherit; }
  button { cursor: pointer; }
  .noscrollbar::-webkit-scrollbar { display: none; }
  .noscrollbar { scrollbar-width: none; }

  .theme-dark {
    --bg-0: #000;
    --bg-1: #0a0a0b;
    --bg-2: #141416;
    --bg-wash: radial-gradient(ellipse 120% 80% at 20% 0%, oklch(0.22 0.05 var(--accent-h) / 0.22), transparent 60%),
               radial-gradient(ellipse 100% 70% at 80% 100%, oklch(0.2 0.04 260 / 0.25), transparent 60%),
               #050506;
    --surface: rgba(255,255,255,0.06);
    --surface-strong: rgba(255,255,255,0.09);
    --surface-hi: rgba(255,255,255,0.14);
    --hairline: rgba(255,255,255,0.08);
    --hairline-strong: rgba(255,255,255,0.14);
    --text-0: #fff;
    --text-1: rgba(255,255,255,0.92);
    --text-2: rgba(235,235,245,0.6);
    --text-3: rgba(235,235,245,0.32);
    --shine-top: rgba(255,255,255,0.18);
    --shine-bot: rgba(255,255,255,0.04);
  }
  .theme-light {
    --bg-0: #F4F4F6;
    --bg-1: #FBFBFD;
    --bg-2: #FFFFFF;
    --bg-wash: radial-gradient(ellipse 120% 80% at 20% 0%, oklch(0.92 0.04 var(--accent-h) / 0.5), transparent 60%),
               radial-gradient(ellipse 100% 70% at 80% 100%, oklch(0.9 0.035 260 / 0.6), transparent 60%),
               #F3F3F6;
    --surface: rgba(255,255,255,0.7);
    --surface-strong: rgba(255,255,255,0.82);
    --surface-hi: rgba(255,255,255,0.96);
    --hairline: rgba(60,60,67,0.1);
    --hairline-strong: rgba(60,60,67,0.18);
    --text-0: #000;
    --text-1: rgba(0,0,0,0.88);
    --text-2: rgba(60,60,67,0.7);
    --text-3: rgba(60,60,67,0.4);
    --shine-top: rgba(255,255,255,0.9);
    --shine-bot: rgba(255,255,255,0.3);
  }

  .glass {
    background: var(--surface);
    backdrop-filter: blur(24px) saturate(180%);
    -webkit-backdrop-filter: blur(24px) saturate(180%);
    border: 0.5px solid var(--hairline);
    box-shadow:
      inset 0 0.5px 0 var(--shine-top),
      inset 0 -0.5px 0 var(--shine-bot),
      0 1px 2px rgba(0,0,0,0.06),
      0 8px 24px rgba(0,0,0,0.1);
    position: relative;
  }
  .glass-strong {
    background: var(--surface-strong);
    backdrop-filter: blur(40px) saturate(200%);
    -webkit-backdrop-filter: blur(40px) saturate(200%);
    border: 0.5px solid var(--hairline-strong);
    box-shadow:
      inset 0 1px 0 var(--shine-top),
      inset 0 -1px 0 var(--shine-bot),
      0 2px 6px rgba(0,0,0,0.1),
      0 12px 40px rgba(0,0,0,0.18);
  }

  .pressable {
    transition: transform 0.24s cubic-bezier(0.34, 1.56, 0.64, 1), background 0.2s, opacity 0.2s, box-shadow 0.2s;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  .pressable:active { transform: scale(0.96); }

  .display {
    font-size: 28px; font-weight: 700; letter-spacing: -0.04em; line-height: 1.05;
  }
  .title1 { font-size: 24px; font-weight: 700; letter-spacing: -0.03em; line-height: 1.15; }
  .title2 { font-size: 18px; font-weight: 600; letter-spacing: -0.02em; line-height: 1.2; }
  .body   { font-size: 15px; font-weight: 500; letter-spacing: -0.01em; line-height: 1.35; }
  .footnote { font-size: 12px; font-weight: 500; letter-spacing: 0.01em; line-height: 1.3; color: var(--text-2); }
  .mono { font-family: 'JetBrains Mono', ui-monospace, monospace; }
  .tabular { font-variant-numeric: tabular-nums; }

  @keyframes slide-up-in {
    0% { opacity: 0; transform: translateY(8px); }
    100% { opacity: 1; transform: translateY(0); }
  }
  @keyframes pop-in {
    0% { opacity: 0; transform: scale(0.92); }
    60% { opacity: 1; transform: scale(1.02); }
    100% { transform: scale(1); }
  }
  @keyframes pulse-accent {
    0%, 100% { opacity: 0.7; transform: scale(1); }
    50% { opacity: 1; transform: scale(1.3); }
  }
  @keyframes highlight-flash {
    0% { background: var(--accent-soft); }
    100% { background: transparent; }
  }
  @keyframes qty-bump {
    0% { transform: scale(1); }
    40% { transform: scale(1.18); }
    100% { transform: scale(1); }
  }

  .stage {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 40px 20px;
    background: radial-gradient(ellipse at top, #252527, #0e0e10);
  }

  .tweaks {
    position: fixed; right: 20px; top: 20px; width: 260px;
    padding: 16px; border-radius: 22px;
    background: rgba(30,30,32,0.72);
    backdrop-filter: blur(40px) saturate(180%);
    -webkit-backdrop-filter: blur(40px) saturate(180%);
    border: 0.5px solid rgba(255,255,255,0.12);
    box-shadow: 0 20px 60px rgba(0,0,0,0.4), inset 0 1px 0 rgba(255,255,255,0.1);
    color: #fff; font-size: 13px; z-index: 1000; display: none;
  }
  .tweaks.on { display: block; }
  .tweaks h3 { margin: 0 0 12px; font-size: 13px; font-weight: 600; letter-spacing: -0.02em; opacity: 0.9; }
  .tweak-row { display: flex; align-items: center; justify-content: space-between; padding: 8px 0; gap: 12px; }
  .tweak-row + .tweak-row { border-top: 0.5px solid rgba(255,255,255,0.08); }
  .tweak-label { color: rgba(255,255,255,0.6); font-size: 12px; }
  .tweak-seg { display: flex; gap: 2px; background: rgba(255,255,255,0.08); padding: 2px; border-radius: 8px; }
  .tweak-seg button { background: transparent; border: 0; color: rgba(255,255,255,0.6); padding: 4px 8px; border-radius: 6px; font-size: 11px; font-weight: 500; cursor: pointer; transition: all 0.2s; }
  .tweak-seg button.on { background: rgba(255,255,255,0.14); color: #fff; }
  .tweak-swatches { display: flex; gap: 6px; }
  .tweak-swatches button { width: 22px; height: 22px; border-radius: 50%; border: 1.5px solid rgba(255,255,255,0.2); cursor: pointer; padding: 0; transition: transform 0.2s; }
  .tweak-swatches button.on { border-color: #fff; transform: scale(1.15); }

  [data-screen-label] { scroll-margin-top: 20px; }
</style>
</head>
<body class="theme-dark">

<div class="stage" id="stage">
  <div id="root"></div>
</div>

<div class="tweaks" id="tweaks">
  <h3>Tweaks</h3>
  <div class="tweak-row">
    <span class="tweak-label">Accent</span>
    <div class="tweak-swatches" data-tweak="accent">
      <button data-val="green" class="on" style="background: #48d07b;"></button>
      <button data-val="blue" style="background: oklch(0.7 0.15 240);"></button>
      <button data-val="amber" style="background: oklch(0.8 0.15 75);"></button>
      <button data-val="violet" style="background: oklch(0.68 0.18 295);"></button>
      <button data-val="mono" style="background: oklch(0.7 0.02 260);"></button>
    </div>
  </div>
  <div class="tweak-row">
    <span class="tweak-label">Theme</span>
    <div class="tweak-seg" data-tweak="theme">
      <button data-val="dark" class="on">Dark</button>
      <button data-val="light">Light</button>
      <button data-val="auto">Auto</button>
    </div>
  </div>
  <div style="margin-top: 10px; padding-top: 10px; border-top: 0.5px solid rgba(255,255,255,0.08); font-size: 11px; color: rgba(255,255,255,0.5); line-height: 1.5;">
    Theme also toggles in-app — <br/>Settings → Appearance.<br/>
    Hold the logo to discover a secret.
  </div>
</div>

<script>
  window.TWEAKS = /*EDITMODE-BEGIN*/{
    "theme": "dark",
    "accent": "green"
  }/*EDITMODE-END*/;
</script>

</body>
</html>
