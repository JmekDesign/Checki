<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>Checki — Staff</title>
  <link rel="stylesheet" href="./app.css">
</head>
<body>
  <div class="toast" id="toast"></div>

  <!-- Payment method modal (receipt) — content injected by ui.js -->
  <div class="modalBack hide" id="payBack"></div>

  <!-- Staff add/edit modal -->
  <div class="modalBack hide" id="staffModalBack"></div>

  <!-- Confirm modal -->
  <div class="modalBack hide" id="confirmBack">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="confirmTitle">
      <div class="modalTitle" id="confirmTitle">Confirm</div>
      <div class="modalText" id="confirmText">—</div>
      <div class="modalBtns">
        <button class="btn" id="confirmCancel">Cancel</button>
        <button class="btn primary" id="confirmOk">OK</button>
      </div>
    </div>
  </div>

  <div class="wrap">
    <div class="topWrap" id="topWrap">
      <div class="top">
        <div class="topLeft">
          <span class="brandName" id="brandName">Checki</span>
          <button class="btnGear hide" id="btnVenue" title="Venue settings">⚙</button>
        </div>
        <button class="btnIcon btnIconDanger hide" id="btnLogout" title="Logout">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
            <polyline points="16 17 21 12 16 7"/>
            <line x1="21" y1="12" x2="9" y2="12"/>
          </svg>
        </button>
      </div>
      <div class="tabBar hide" id="tabBar">
        <button class="tabBtn" id="tabOpen">Open</button>
        <button class="tabBtn" id="tabArchive">Archive</button>
        <div class="tabFlex"></div>
        <button class="btn compact primary hide tabBarAction" id="btnNewCheck">+ New</button>
      </div>
    </div>

    <!-- LOGIN -->
    <div class="card" id="screenLogin">
      <div class="h1">Login</div>
      <div class="muted">Staff interface (MVP).</div>
      <div class="hr"></div>
      <div class="row">
        <input class="inp" id="login" placeholder="login" value="" />
        <input class="inp" id="password" placeholder="password" value="" type="password" />
      </div>
      <div class="row" style="margin-top:10px">
        <button class="btn primary" id="btnLogin">Login</button>
      </div>
    </div>

    <!-- OPEN CHECKS -->
    <div class="card cardless hide" id="screenOpen">
      <input class="inp" id="openSearch" placeholder='Search…' style="margin-top:4px" />
      <div style="height:10px"></div>
      <div class="list" id="openList"></div>
      <div class="muted" id="openHint" style="margin-top:10px"></div>
    </div>

    <!-- ARCHIVE -->
    <div class="card cardless hide" id="screenArchive">
      <!-- Search -->
      <input class="inp" id="archSearch" placeholder="Search: guest, item, amount…" style="margin-bottom:10px" />

      <!-- Quick date filters: horizontal scroll -->
      <div class="archQuickBar">
        <button class="btn archQuick" data-q="today">Today</button>
        <button class="btn archQuick" data-q="week">Week</button>
        <button class="btn archQuick" data-q="month">30 days</button>
        <button class="btn archQuick" data-q="curmonth" id="btnCurMonth">—</button>
        <button class="btn archQuick" data-q="all">All</button>
      </div>

      <!-- Date range (custom picker) + PDF -->
      <input type="date" id="archFrom" style="display:none" />
      <input type="date" id="archTo"   style="display:none" />
      <div class="row" style="gap:8px; align-items:center; margin-top:10px; margin-bottom:4px">
        <button class="btn dpBtn" id="dpBtnFrom" style="flex:1">From…</button>
        <span class="muted">—</span>
        <button class="btn dpBtn" id="dpBtnTo" style="flex:1">To…</button>
        <button class="btnIcon" id="btnArchReset" title="Reset dates" style="color:var(--muted);font-size:16px">✕</button>
        <button class="btn dpBtn primary" id="btnArchShare" style="flex:none;display:flex;align-items:center;gap:4px;padding:7px 10px;margin-left:8px">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
          PDF
        </button>
      </div>

      <div class="hr" style="margin-top:12px"></div>

      <!-- Stats dashboard -->
      <div id="archStats" style="display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-bottom:12px"></div>

      <!-- Check list grouped by day -->
      <div id="archList"></div>
      <div class="muted" id="archHint" style="margin-top:10px;text-align:center"></div>

      <!-- Pager -->
      <div class="row" style="justify-content:space-between; margin-top:12px">
        <button class="btn" id="btnArchPrev">← Prev</button>
        <div class="muted" id="archPager">—</div>
        <button class="btn" id="btnArchNext">Next →</button>
      </div>
    </div>

    <!-- VENUE (manager screen) -->
    <div class="card cardless hide" id="screenVenue">
      <div id="venueHeader"></div>
      <div class="hr"></div>

      <!-- Staff -->
      <div class="row" style="justify-content:space-between;align-items:center;margin-bottom:10px">
        <div style="font-size:15px;font-weight:700">Staff</div>
        <button class="btn compact primary" id="btnAddStaff">+ Add</button>
      </div>
      <div class="list" id="venueStaff"></div>

      <div class="hr"></div>

      <!-- Features -->
      <div style="display:flex;flex-direction:column;gap:8px">
        <div class="item" id="btnGoCatalog" style="cursor:pointer">
          <span style="font-weight:500">Product catalog</span><span class="muted">→</span>
        </div>
        <div class="item" style="opacity:.3;cursor:default">
          <span>Procurement</span><span class="muted">→</span>
        </div>
        <div class="item" style="opacity:.3;cursor:default">
          <span>Subscription</span><span class="muted">→</span>
        </div>
      </div>
    </div>

    <!-- CATALOG (manager) -->
    <div class="card cardless hide" id="screenCatalog">
      <div class="row" style="justify-content:space-between;align-items:center;margin-bottom:12px">
        <button class="btn compact" id="btnBackToCatalog">← Back</button>
        <button class="btn compact primary" id="btnAddProduct">+ Add</button>
      </div>
      <input class="inp" id="catalogSearch" placeholder="Search products…" style="margin-bottom:10px" />
      <div id="catalogList"></div>
      <div class="muted" id="catalogHint" style="margin-top:10px;text-align:center"></div>
    </div>

    <!-- Catalog modal -->
    <div class="modalBack hide" id="catalogModalBack"></div>

    <!-- NEW CHECK -->
    <div class="card hide" id="screenNew">
      <div class="row" style="justify-content:space-between">
        <div>
          <div class="h1" style="margin-bottom:4px">New check</div>
          <div class="muted">Guest / table</div>
        </div>
        <button class="btn" id="btnBackOpen">← Back</button>
      </div>
      <div class="hr"></div>
      <input class="inp" id="guestName" placeholder='Example: "Table 7 / Ira"' />
      <div class="row" style="margin-top:10px">
        <button class="btn primary" id="btnCreateCheck">Open check</button>
      </div>
    </div>

    <!-- CHECK -->
    <div class="card hide" id="screenCheck">
      <div class="row" style="justify-content:space-between; align-items:flex-start">
        <div style="min-width:0">
          <div class="h1" id="checkTitle" style="margin-bottom:2px">Check</div>
          <div class="muted" id="checkMeta" style="font-size:13px">—</div>
          <div id="checkTotal" style="margin-top:6px;font-size:22px;font-weight:800;color:var(--accent)">—</div>
        </div>
        <div style="display:flex; gap:8px; align-items:center">
          <button class="btn compact" id="btnBackFromCheck">← Checks</button>
          <button class="btn danger" id="btnCloseCheck">Close</button>
        </div>
      </div>

      <div style="height:10px"></div>
      <div class="list" id="itemsList"></div>
      <div class="muted" id="itemsHint" style="margin-top:10px">Empty. Add items below.</div>
    </div>
  </div>

  <!-- BOTTOM BAR -->
  <div class="bottom hide" id="bottomBar">
    <div class="inner">
      <div class="suggestBox" id="suggestBox"></div>

      <div class="addRow1">
        <input class="inp" id="itemName" placeholder='Add item… (type any fragment)' autocomplete="off" />
      </div>

      <div class="addRow2">
        <div class="qtyCtl" title="Quantity">
          <button class="btn" id="btnQtyDec">–</button>
          <strong id="qtyVal" style="min-width:16px;text-align:center;display:inline-block">1</strong>
          <button class="btn" id="btnQtyInc">+</button>
        </div>

        <input class="smallInp" id="itemPrice" inputmode="decimal" placeholder="Price/1" />
        <input class="totalBox" id="itemTotal" placeholder="Total" readonly />
        <button class="btn primary" id="btnAddItem">Add</button>
      </div>

      <div class="muted hide" id="addMsg" style="margin-top:6px"></div>
      <div class="chips" id="quickChips"></div>
    </div>
  </div>

  <script defer src="./main.js"></script>
</body>
</html>
