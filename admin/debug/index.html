<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Checki — Admin</title>
  <style>
    body { font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial; margin: 24px; max-width: 920px; }
    .row { display:flex; gap:12px; flex-wrap: wrap; }
    input, button { padding:10px 12px; font-size:14px; }
    input { min-width: 220px; }
    button { cursor:pointer; }
    pre { background:#111; color:#0f0; padding:12px; overflow:auto; border-radius:10px; }
    .card { border:1px solid #ddd; border-radius:12px; padding:14px; margin: 14px 0; }
    .muted { color:#666; }
  </style>
</head>
<body>
  <h1>Checki — Admin (MVP)</h1>
  <p class="muted">API: <span id="apiBase"></span></p>

  <div class="card">
    <h3>Login</h3>
    <div class="row">
      <input id="login" placeholder="login" value="demo_manager"/>
      <input id="password" placeholder="password" value="demo_pass" type="password"/>
      <button id="btnLogin">Login</button>
      <button id="btnMe">Me</button>
      <button id="btnLogout">Logout</button>
    </div>
    <p class="muted">Token: <span id="tokenShort">—</span></p>
  </div>

  <div class="card">
    <h3>Quick actions</h3>
    <div class="row">
      <button id="btnListChecks">List open checks</button>
    </div>
  </div>

  <h3>Response</h3>
  <pre id="out">—</pre>

<script>
  const API = "https://api.checki.ge";
  document.getElementById("apiBase").textContent = API;

  const out = (x) => document.getElementById("out").textContent = (typeof x === "string") ? x : JSON.stringify(x, null, 2);
  const tokenKey = "checki_token";
  const getToken = () => localStorage.getItem(tokenKey) || "";
  const setToken = (t) => { localStorage.setItem(tokenKey, t || ""); renderToken(); };

  function renderToken(){
    const t = getToken();
    document.getElementById("tokenShort").textContent = t ? (t.slice(0,8) + "…") : "—";
  }
  renderToken();

  async function api(path, {method="GET", body=null}={}){
    const headers = {};
    if (body) headers["content-type"] = "application/json";
    const t = getToken();
    if (t) headers["Authorization"] = "Bearer " + t;

    const res = await fetch(API + path, { method, headers, body: body ? JSON.stringify(body) : null });
    const txt = await res.text();
    let data = null;
    try { data = JSON.parse(txt); } catch(e) { data = { raw: txt }; }
    return { status: res.status, data, headers: Object.fromEntries(res.headers.entries()) };
  }

  document.getElementById("btnLogin").onclick = async () => {
    const login = document.getElementById("login").value.trim();
    const password = document.getElementById("password").value;
    const r = await api("/api/auth/login", { method:"POST", body:{login, password} });
    if (r.data && r.data.token) setToken(r.data.token);
    out(r);
  };

  document.getElementById("btnMe").onclick = async () => {
    const r = await api("/api/auth/me");
    out(r);
  };

  document.getElementById("btnLogout").onclick = async () => {
    const r = await api("/api/auth/logout", { method:"POST" });
    setToken("");
    out(r);
  };

  document.getElementById("btnListChecks").onclick = async () => {
    const r = await api("/api/checks/open");
    out(r);
  };
</script>
</body>
</html>
